name: Build mono-nx SDK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mono-nx.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Checkout port repo
        uses: actions/checkout@v4

      - name: Clone mono-nx
        run: |
          git clone --recursive --depth 1 --shallow-submodules \
            https://github.com/pixelomer/mono-nx.git mono-nx
          git -C mono-nx rev-parse HEAD
          git -C mono-nx log -1 --format='%ci %s'

      # The devkitA64 image ships Python 3.11, but the Horizon build scripts call
      # tarfile.extractall(filter='data'), which only exists in 3.12+.
      # A sitecustomize shim adds the keyword without dirtying the checkout
      # (mono-nx's git_source refuses a dirty dependency tree).
      - name: Write Python tarfile shim
        run: |
          mkdir -p shim
          cat > shim/sitecustomize.py <<'PY'
          import tarfile

          _orig = tarfile.TarFile.extractall

          def _extractall(self, path=".", members=None, *, numeric_owner=False, filter=None):
              if filter is None:
                  return _orig(self, path, members, numeric_owner=numeric_owner)
              try:
                  return _orig(self, path, members, numeric_owner=numeric_owner, filter=filter)
              except TypeError:
                  # Python < 3.12: no filter support, extract as before.
                  return _orig(self, path, members, numeric_owner=numeric_owner)

          tarfile.TarFile.extractall = _extractall
          PY
          cat shim/sitecustomize.py

      - name: Show runner capacity
        run: |
          df -h /
          nproc
          free -h

      # Stage 1: mono-nx's own pinned toolchain image.
      - name: Build mono-nx toolchain image
        run: docker build mono-nx --file mono-nx/Dockerfile --tag monobuild-base

      # Stage 2: bookworm ships clang-14, but the pinned LLVM 19 libc++ headers
      # need Clang 17+. This layer installs clang-19 and makes it the default.
      - name: Add Clang 19 to the toolchain image
        run: docker build --file ci/Dockerfile.mononx --tag monobuild .

      - name: Verify toolchain inside image
        run: |
          docker run --rm --entrypoint /bin/bash monobuild -c '
            set -e
            python3 --version
            clang --version
            clang++ --version
            llvm-config --version || true
          '

      - name: Build mono-nx
        run: |
          docker run --rm -w /mono-nx \
            -v "$PWD/mono-nx:/mono-nx" \
            -v "$PWD/shim:/shim:ro" \
            -e PYTHONPATH=/shim \
            --entrypoint /bin/bash monobuild ./github_actions_build.sh

      - name: Collect outputs
        if: always()
        run: |
          df -h /
          ls -la mono-nx/artifacts 2>/dev/null || true
          ls -la mono-nx/native/interpreter 2>/dev/null || true
          ls -la mono-nx/sd_files 2>/dev/null | head -40 || true
          ls -la mono-nx/*.zip 2>/dev/null || true

      - name: Upload SDK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mono-nx-sdk
          path: mono-nx/mono-nx-sdk-linux-x64.zip
          if-no-files-found: warn

      - name: Upload sd files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mono-nx-sd-files
          path: mono-nx/sd_files.zip
          if-no-files-found: warn

      - name: Upload demo nro
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mono-nx-demo
          path: mono-nx/native/interpreter/mono_nx.nro
          if-no-files-found: warn
